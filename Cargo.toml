[package]
name = "framecast"
version = "0.1.0"
edition = "2024"
description = "Screen recorder that turns plain captures into polished product demos (auto zoom, smooth cursor, backgrounds)."
license = "MIT"
publish = false

# Supply-chain policy (see SECURITY.md):
#  * The only direct dependency is Microsoft's official `windows` crate.
#  * Every version is pinned with `=` and Cargo.lock is committed.
#  * Build with `cargo build --release --locked` so the lock file can't drift.
[dependencies.windows]
version = "=0.62.2"
features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Imaging_D2D",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

# Same crate the `windows` crate already depends on (Matrix3x2 / Vector2 for Direct2D).
[dependencies.windows-numerics]
version = "=0.3.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = true

[profile.dev]
opt-level = 1
